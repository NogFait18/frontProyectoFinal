<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/style.css">
    <title>Pedidos</title>
</head>

<body>
    <header class="headerAdm">
        <div class="headerAdm_div">
            <h2 class="h2_admin">🍕Food Store</h2>
        </div>
        <nav class="header_nav">
            <ul class="nav_ul">
                <!-- Aca cambiar despues porque tiene que traer el nombre de usuario -->
                <li id="user-name">Invitado</li>

                <!-- Botón de volver al admin -->
                <li id="btn-admin" style="display: none;">
                    <button id="go-admin">Volver al Admin</button>
                </li>
                <li id="btn-admin">
                    <a href="../../store/cart/cart.html">
                        <div class="carrito_logo_container">
                            <svg class="carrito_svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                                <defs>
                                    <style>
                                        .cls-1 {
                                            fill: #c6c3d8
                                        }

                                        .cls-4 {
                                            fill: #425b72
                                        }

                                        .cls-5 {
                                            fill: #374f68
                                        }
                                    </style>
                                </defs>
                                <g id="Shopping_cart" data-name="Shopping cart">
                                    <path class="cls-1"
                                        d="M39 41H10.16a4.17 4.17 0 0 1-3.61-6.23C11 27.06 9.41 28 21 28a1 1 0 0 1 0 2c-10.91 0-8.76-1.14-12.72 5.77A2.17 2.17 0 0 0 10.16 39H39a1 1 0 0 1 0 2z" />
                                    <path
                                        d="M45 8a1.61 1.61 0 0 1 1.55 2c0 .1-4.22 18.54-4.2 18.44a2 2 0 0 1-2 1.56H13c-.47-2.17-3.6-16.85-4.71-22z"
                                        style="fill:#dad7e5" />
                                    <path
                                        d="M45 8a1.61 1.61 0 0 1 1.55 2c-.73 3.23-2.95 13-3.87 17h-7.25a24 24 0 0 1-23.5-19z"
                                        style="fill:#edebf2" />
                                    <path class="cls-4" d="M22 44a3 3 0 1 1-5.56-1.56A3 3 0 0 1 22 44z" />
                                    <path class="cls-5" d="M20.56 46.56a3 3 0 0 1-4.12-4.12 3 3 0 0 1 4.12 4.12z" />
                                    <path class="cls-4" d="M36 44a3 3 0 1 1-5.56-1.56A3 3 0 0 1 36 44z" />
                                    <path class="cls-5" d="M34.56 46.56a3 3 0 0 1-4.12-4.12 3 3 0 0 1 4.12 4.12z" />
                                    <path class="cls-1"
                                        d="m45.18 16 .46-2H34V8h-2v6h-9V8h-2v6H9.57l.43 2h11v6h-9.71l.43 2H21v6h2v-6h9v6h2v-6h9.36l.46-2H34v-6zM32 22h-9v-6h9z" />
                                    <path class="cls-1"
                                        d="M46.56 10A1.61 1.61 0 0 0 45 8H9.31l-1-4.63A3 3 0 0 0 5.38 1H2a1 1 0 0 0 0 2h3.38a1 1 0 0 1 1 .79c6.09 28.45 5.62 26.4 5.75 26.47.92-.43 28.37-.26 28.27-.26a2 2 0 0 0 2-1.56c-.02-.11 4.39-19.51 4.16-18.44zm-6.11 18H13.6L9.74 10h34.81z" />
                                </g>
                            </svg>
                            <div class="carrito_contador" id="cart_count">0</div>
                        </div>
                    </a>
                </li>

                <!-- Botón de cerrar sesión -->
                <li><button id="btn-logout">Cerrar Sesión</button></li>
            </ul>
        </nav>
    </header>
    <main>

        <div class="adm">
            <aside class="adm_controles">
                <h3>Volver a la tienda</h3>
                <nav class="panel" id="categoriasPanel">
                    <section class="panelControl">
                        <a href="../../store/home.html">🏪 Tienda</a>

                    </section>
                </nav>
            </aside>

            <div class="adm_categorias-container">
                <div class="adm_titulo">
                    <h1>Gestión de Pedidos</h1>
                    <select id="filtroPedidos">
                        <option value="TODOS">Todos los pedidos</option>
                        <option value="PENDIENTE">Pendientes</option>
                        <option value="CONFIRMADO">Confirmados</option>
                        <option value="CANCELADO">Cancelados</option>
                        <option value="TERMINADO">Terminados</option>
                    </select>

                </div>
                <!-- modelo a reutilizar en categorias y productos, esto no va despues -->
                <section class="card_containerPed" id="card_containerPed">

                </section>

                <div id="modalPedido" class="modal hidden">
                    <div class="modal_contenido">
                        <span id="cerrarModal" class="cerrar">X</span>

                        <h2>Detalle del pedido</h2>

                        <div id="modalPedidoContenido">
                            <!-- acá se llena dinámicamente -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script type="module">
        import { cargarHeaderUsuario, cerrarSesion } from "/src/utils/authHeader.ts";

        cargarHeaderUsuario();

        const btnCerrar = document.getElementById("btn-logout");
        if (btnCerrar) btnCerrar.addEventListener("click", cerrarSesion);
    </script>
    <script type="module" src="./orders.js"></script>
</body>

</html>
