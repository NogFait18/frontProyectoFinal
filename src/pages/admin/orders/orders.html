<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/style.css">
    <title>Pedidos</title>
</head>
<body>
    <header class="headerAdm">
        <div class="headerAdm_div">
            <h2 class="h2_admin">🍕Food Store</h2>
        </div>
        <nav class="header_nav">
            <ul class="nav_ul">
                <!-- Aca cambiar despues porque tiene que traer el nombre de usuario -->
                <!-- Mostrar nombre del usuario -->
                <li id="user-name">Invitado</li>

                <!-- Botón de cerrar sesión -->
                <li><button id="btn-logout">Cerrar Sesión</button></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="adm">
            <aside class="adm_controles">
                <h3>Administración</h3>
                <p>Panel de control</p>
                <nav class="panel">
                <section class="panelControl"> <a href="../adminHome/adminHome.html">📊DashBoard</a></section>
                <section class="panelControl"> <a href="../categories/categories.html">📂Categorias</a></section>
                <section class="panelControl"><a href="../products/productos.html">🍔Productos</a></section>
                <section class="panelControl">📦Pedidos</section>
                <section class="panelControl"><a href="/src/pages/store/home.html">🏪Ver Tienda</a></section>
                </nav>
            </aside>
            <div class="adm_categorias-container">
                <div class="adm_titulo">
                    <h1>Gestión de Pedidos</h1>
                    <select id="filtroPedidos">
                        <option value="TODOS">Todos los pedidos</option>
                        <option value="PENDIENTE">Pendientes</option>
                        <option value="CONFIRMADO">Confirmados</option>
                        <option value="CANCELADO">Cancelados</option>
                        <option value="TERMINADO">Terminados</option>
                    </select>
                    <div id="modalEditar" class="modal hidden">
                        <div class="modal-content">
                            <h3>Editar estado del pedido</h3>
                    
                            <h2 id="modal-pedido-id"></h2>
                    
                            <label for="select-estado">Nuevo estado:</label>
                            <select id="select-estado">
                                <option value="PENDIENTE">PENDIENTE</option>
                                <option value="CONFIRMADO">CONFIRMADO</option>
                                <option value="CANCELADO">CANCELADO</option>
                                <option value="TERMINADO">TERMINADO</option>
                            </select>
                    
                            <div class="modal-buttons">
                                <button id="guardar-estado">Guardar</button>
                                <button id="cerrar-modal">Cerrar</button>
                            </div>
                        </div>
                    </div>

                </div>
                <!-- modelo a reutilizar en categorias y productos, esto no va despues -->
                <section class="card_containerPed" id="card_containerPed">

                </section>
            </div>
        </div>
    </main>
    <script type="module">
    import { cargarHeaderUsuario, cerrarSesion } from "/src/utils/authHeader.ts";

    cargarHeaderUsuario();

    const btnCerrar = document.getElementById("btn-logout");
    if (btnCerrar) btnCerrar.addEventListener("click", cerrarSesion);
    </script>

</body>
<script type="module" src="./orders.js"></script>
</html>
