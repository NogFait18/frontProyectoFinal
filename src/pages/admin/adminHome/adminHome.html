<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/style.css">
    <title>Admin Home</title>
</head>
<body>
    <header class="headerAdm">
        <div class="headerAdm_div">
            <h2 class="h2_admin">🍕Food Store</h2>
        </div>
        <nav class="header_nav">
            <ul class="nav_ul">
                <!-- Aca cambiar despues porque tiene que traer el nombre de usuario -->
                <li id="user-name">Invitado</li>

                <!-- Botón de cerrar sesión -->
                <li><button id="btn-logout">Cerrar Sesión</button></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="adm">
            <aside class="adm_controles">
                <h3>Administración</h3>
                <p>Panel de control</p>
                <nav class="panel">
                <section class="panelControl">📊DashBoard</section>
                <section class="panelControl"><a href="../categories/categories.html">📂Categorias</a></section>
                <section class="panelControl"> <a href="../products/productos.html">🍔Productos</a></section>
                <section class="panelControl"><a href="../orders/orders.html">📦Pedidos</a></section>
                <section class="panelControl"><a href="/src/pages/store/home.html">🏪Ver Tienda</a></section>
                </nav>
            </aside>
            <div class="adm_panelAdm">
                <h1>Panel de Administración</h1>
                <div class="panelAdm_controles">
                    <section class="tarjetaAdm">
                        <h3>📂Categorias</h3>
                        <p id="categoriasStock">0</p>
                        <button>
                            <a href="../categories/categories.html">Gestionar</a>

                        </button>
                    </section>
                    <section class="tarjetaAdm">
                        <h3>🍔Productos</h3>
                        <p id="productosStock">0</p>
                        <button>
                            <a>Gestionar</a>
                        </button>
                    </section>
                    <section class="tarjetaAdm">
                        <h3>📦Pedidos</h3>
                        <p id="pedidosStock">0</p>
                        <button>
                            <a href="../orders/orders.html">Gestionar</a>
                        </button>
                    </section>
                    <section class="tarjetaAdm">
                        <h3>✅Disponible</h3>
                        <p id="productosConStock">0</p>
                    </section>
                </div>
            </div>
        </div>
    </main>
    <script type="module">
    import { cargarHeaderUsuario, cerrarSesion } from "/src/utils/authHeader.ts";

    cargarHeaderUsuario();

    const btnCerrar = document.getElementById("btn-logout");
    if (btnCerrar) btnCerrar.addEventListener("click", cerrarSesion);
    </script>
</body>
<script type="module" src="./adminHome.ts"></script>
</html>
